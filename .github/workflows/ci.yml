name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error bgone.sh install.sh uninstall.sh
      - name: python syntax
        run: python3 -m py_compile bgone-worker.py
      - name: version + changelog consistency
        run: |
          v=$(grep -oP 'VERSION="\K[^"]+' bgone.sh)
          c=$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          echo "bgone.sh VERSION=$v ; CHANGELOG top=$c"
          test "$v" = "$c"
      - name: smoke (help/version run without the runtime)
        run: |
          v=$(grep -oP 'VERSION="\K[^"]+' bgone.sh)
          U2NET_HOME=/tmp/bgm bash bgone.sh --version | grep -qx "bgone $v"
          U2NET_HOME=/tmp/bgm bash bgone.sh --help >/dev/null
